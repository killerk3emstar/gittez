services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gittez
      POSTGRES_USER: gittez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gittez -d gittez"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=gittez;Username=gittez;Password=${POSTGRES_PASSWORD}"
      GitHub__Token: ${GITHUB_TOKEN:-}
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    # Port wystawiony wyłącznie dla Scalara i ręcznych strzałów - przeglądarka
    # chodzi na 8080, a stamtąd nginx proxuje /api po sieci wewnętrznej.
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
