services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gitbounty
      POSTGRES_USER: gitbounty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitbounty -d gitbounty"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=gitbounty;Username=gitbounty;Password=${POSTGRES_PASSWORD}"
      GitHub__Token: ${GITHUB_TOKEN:-}
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
