name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: Testy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test src/Gittez.Tests/Gittez.Tests.csproj --configuration Release

  web:
    name: Testy frontu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke

  images:
    name: Obrazy
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: .
          - service: web
            context: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Na PR obraz się tylko buduje. Publikacja bez zielonych testów nie ma
      # sensu, a publikacja z gałęzi to śmieci w rejestrze.
      - name: Logowanie do GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagi
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy na Railway
    needs: images
    if: github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: npm install -g @railway/cli

      # Railway ciągnie obraz z GHCR, więc redeploy jest jedynym potrzebnym
      # sygnałem - nic tu nie budujemy po raz drugi.
      - name: Redeploy usług
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy --service "${{ vars.RAILWAY_API_SERVICE }}" --yes
          railway redeploy --service "${{ vars.RAILWAY_WEB_SERVICE }}" --yes
