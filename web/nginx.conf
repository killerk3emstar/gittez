server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Front i API na jednym originie: backend nie potrzebuje CORS-u, a
    # X-Data-Stale jest widoczny dla fetcha bez expose-headers.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Świeży przebieg to ~100 wywołań do GitHuba i 6-8 sekund (SPEC §2.2),
        # więc domyślne 60 s w nginxie byłoby za ciasne przy wolnej sieci.
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routing jest po stronie klienta, więc wejście prosto w /wyniki musi
    # dostać index.html, a nie 404 od nginxa.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
